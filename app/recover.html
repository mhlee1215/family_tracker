<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Family Tracker Recovery</title>
    <style>
      :root {
        color: #2c2118;
        background: #f7f3ea;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: #6f6258;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing Family Tracker</h1>
      <p id="status">Clearing the app cache...</p>
    </main>
    <script>
      (async () => {
        const status = document.getElementById('status');
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys
              .filter((key) => key.startsWith('family-tracker'))
              .map((key) => caches.delete(key)));
          }
          status.textContent = 'Opening the latest app...';
        } catch {
          status.textContent = 'Opening the app...';
        }
        window.location.replace('/?cache-reset=' + Date.now());
      })();
    </script>
  </body>
</html>
