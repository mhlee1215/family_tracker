<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ea">
    <title>Family Tracker</title>
    <link rel="manifest" href="/app/manifest.webmanifest">
    <link rel="stylesheet" href="/app/styles.css">
  </head>
  <body>
    <main id="app" class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Baby Tracker</p>
          <h1>오늘</h1>
        </div>
        <button id="refresh" type="button" class="ghost-button">새로고침</button>
      </header>

      <section id="summary" class="summary-strip" aria-label="오늘 요약"></section>

      <section id="sleep-status" class="sleep-status hidden" aria-live="polite"></section>

      <section class="workspace-grid">
        <section class="phone-flow">
          <form id="log-form" class="input-panel" autocomplete="off">
            <label for="log-input">기록</label>
            <div class="composer-row">
              <input id="log-input" name="log" type="text" placeholder="분유, 낮잠, 깸, 고구마 먹음" autofocus>
              <button type="submit">저장</button>
            </div>
            <div id="quick-actions" class="quick-actions" aria-label="추천 기록"></div>
          </form>

          <section class="timeline-section">
            <div class="section-header">
              <h2>타임라인</h2>
              <span id="event-count" class="muted-count">0개</span>
            </div>
            <div id="timeline" class="timeline"></div>
          </section>
        </section>

        <aside class="tablet-board" aria-label="패드용 빠른 기록">
          <div class="section-header">
            <h2>패드 보드</h2>
            <span class="muted-count">공용 입력</span>
          </div>
          <div id="tablet-actions" class="tablet-actions"></div>

          <form id="ask-form" class="ask-panel" autocomplete="off">
            <label for="ask-input">질문</label>
            <div class="composer-row compact">
              <input id="ask-input" name="ask" type="text" placeholder="오늘 총 수면시간?">
              <button type="submit">질문</button>
            </div>
            <p id="answer" class="answer-text"></p>
          </form>
        </aside>
      </section>
    </main>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
