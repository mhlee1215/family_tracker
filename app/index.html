<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ea">
    <title>Family Tracker</title>
    <link rel="manifest" href="/app/manifest.webmanifest">
    <link rel="stylesheet" href="/app/styles.css">
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="panel hero-panel">
        <div>
          <p class="eyebrow">Baby Tracker MVP</p>
          <h1>짧게 쓰면 기록으로 정리해요.</h1>
        </div>
        <div id="summary" class="summary-strip"></div>
      </section>

      <section class="log-layout">
        <form id="log-form" class="input-panel" autocomplete="off">
          <label for="log-input">오늘 기록</label>
          <div class="composer-row">
            <input id="log-input" name="log" type="text" placeholder="분유, 낮잠, 깸, 고구마 먹음" autofocus>
            <button type="submit">저장</button>
          </div>
          <div id="quick-actions" class="quick-actions" aria-label="빠른 기록"></div>
        </form>

        <section class="ask-panel">
          <form id="ask-form" autocomplete="off">
            <label for="ask-input">질문</label>
            <div class="composer-row">
              <input id="ask-input" name="ask" type="text" placeholder="오늘 총 수면시간?">
              <button type="submit">질문</button>
            </div>
          </form>
          <p id="answer" class="answer-text"></p>
        </section>
      </section>

      <section class="timeline-section">
        <div class="section-header">
          <h2>오늘 타임라인</h2>
          <button id="refresh" type="button">새로고침</button>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
