<!doctype html>
<html lang="ko" data-theme="warm">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ea">
    <title>Family Tracker</title>
    <link rel="manifest" href="/app/manifest.webmanifest">
    <link rel="stylesheet" href="/app/styles.css">
  </head>
  <body>
    <header class="global-nav">
      <div class="global-nav-inner">
        <span class="global-brand">Family Tracker</span>
        <div class="top-actions">
          <section id="auth-panel" class="auth-panel hidden" aria-live="polite">
            <span data-i18n="signInTitle">로그인이 필요해요</span>
            <a id="google-login" class="button-link compact-button" href="/api/auth/google/start" data-i18n="googleLogin">Google로 로그인</a>
          </section>

          <div class="top-menu">
            <button id="menu-toggle" type="button" class="menu-button" aria-haspopup="true" aria-expanded="false" aria-label="Account and settings">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 12.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
                <path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"></path>
              </svg>
            </button>
            <div id="menu-panel" class="menu-panel hidden">
              <section id="account-panel" class="account-panel hidden" aria-live="polite">
                <span id="account-label"></span>
                <button id="logout" type="button" class="ghost-button menu-action" data-i18n="logout">로그아웃</button>
              </section>
              <button id="dev-login" type="button" class="ghost-button menu-action hidden" data-i18n="devLogin">Admin 개발 로그인</button>
              <div class="menu-section-title" data-i18n="settings">설정</div>
              <label class="select-control">
                <span data-i18n="theme">테마</span>
                <select id="theme-select" name="theme">
                  <option value="warm">Warm</option>
                  <option value="sage">Sage</option>
                  <option value="contrast">Contrast</option>
                </select>
              </label>
              <label class="select-control">
                <span data-i18n="language">언어</span>
                <select id="language-select" name="language">
                  <option value="ko">한국어</option>
                  <option value="en">English</option>
                  <option value="vi">Tiếng Việt</option>
                </select>
              </label>
              <button id="refresh" type="button" class="ghost-button menu-action" data-i18n="refresh">새로고침</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="app" class="app-shell">
      <header class="top-bar">
        <p class="eyebrow" data-i18n="eyebrow">Baby Tracker</p>
        <div class="date-heading">
          <button id="previous-day" type="button" class="date-step" aria-label="Previous day">‹</button>
          <div class="date-picker-label">
            <h1 id="day-label" class="day-label">오늘</h1>
            <input id="day-picker" class="day-picker" type="date" aria-label="Browse day">
          </div>
          <button id="next-day" type="button" class="date-step" aria-label="Next day">›</button>
        </div>
      </header>

      <section id="summary" class="summary-strip" aria-label="오늘 요약"></section>

      <section id="sleep-status" class="sleep-status hidden" aria-live="polite"></section>

      <section id="workspace" class="workspace-grid">
        <section class="phone-flow">
          <form id="log-form" class="input-panel" autocomplete="off">
            <label for="log-input" data-i18n="log">기록</label>
            <div class="composer-row">
              <input id="log-input" name="log" type="text" placeholder="분유, 낮잠, 깸, 고구마 먹음" autofocus>
              <button type="submit" data-i18n="save">저장</button>
            </div>
            <div id="quick-actions" class="quick-actions" aria-label="추천 기록"></div>
          </form>

          <section class="timeline-section">
            <div class="section-header">
              <h2 data-i18n="timeline">타임라인</h2>
              <span id="event-count" class="muted-count">0개</span>
            </div>
            <div id="timeline" class="timeline"></div>
          </section>
        </section>

        <aside class="tablet-board" aria-label="패드용 빠른 기록">
          <div class="section-header">
            <h2 data-i18n="tabletBoard">패드 보드</h2>
            <span class="muted-count" data-i18n="sharedInput">공용 입력</span>
          </div>
          <div id="tablet-actions" class="tablet-actions"></div>

          <form id="ask-form" class="ask-panel" autocomplete="off">
            <label for="ask-input" data-i18n="question">질문</label>
            <div class="composer-row compact">
              <input id="ask-input" name="ask" type="text" placeholder="오늘 총 수면시간?">
              <button type="submit" data-i18n="ask">질문</button>
            </div>
            <p id="answer" class="answer-text"></p>
          </form>
        </aside>
      </section>
    </main>
    <div id="build-badge" class="build-badge" aria-label="Build number">Build 005</div>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
