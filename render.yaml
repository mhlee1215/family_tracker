services:
  - type: web
    name: family-tracker
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: DATABASE_PROVIDER
        value: turso

  - type: web
    name: family-tracker-slack-bot
    runtime: node
    plan: free
    rootDir: slack-codex-bot
    buildCommand: ""
    startCommand: "node src/server.js"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GITHUB_REPO
        value: mhlee1215/family_tracker
      - key: GITHUB_DEFAULT_BRANCH
        value: main
      - key: GITHUB_DISPATCH_EVENT
        value: family_tracker_slack_request
